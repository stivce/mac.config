---
- name: Install shared packages via Homebrew formulas
  community.general.homebrew:
    name: "{{ package_name_map[item]['darwin'] | default(item) }}"
    state: present
  loop: "{{ shared_packages | difference(homebrew_casks) }}"
  become: false
  tags:
    - packages

- name: Install Homebrew casks via brew command
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_casks }}"
  become: false
  when:
    - homebrew_casks is defined
    - homebrew_casks | length > 0
  tags:
    - packages

- name: Install extra Homebrew formulas
  community.general.homebrew:
    name: "{{ homebrew_formulas_extra }}"
    state: present
  become: false
  when:
    - homebrew_formulas_extra is defined
    - homebrew_formulas_extra | length > 0
  tags:
    - packages

- name: Clone simple-bar widget for Übersicht
  ansible.builtin.git:
    repo: https://github.com/Jean-Tinland/simple-bar.git
    dest: "{{ lookup('env', 'HOME') }}/Library/Application Support/Übersicht/widgets/simple-bar"
    update: false
  tags:
    - packages
    - simple-bar

- name: Restore simple-bar config from dotfiles
  ansible.builtin.command: >
    git --git-dir={{ lookup('env', 'HOME') }}/.macdot
    --work-tree={{ lookup('env', 'HOME') }}
    checkout --
    "Library/Application Support/Übersicht/widgets/simple-bar/lib/settings.js"
    "Library/Application Support/Übersicht/widgets/simple-bar/lib/components/aerospace-context.jsx"
  changed_when: false
  tags:
    - packages
    - simple-bar
