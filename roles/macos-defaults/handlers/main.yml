---
- name: Restart Dock
  ansible.builtin.command: /usr/bin/killall Dock
  changed_when: true

- name: Restart Finder
  ansible.builtin.command: /usr/bin/killall Finder
  changed_when: true

- name: Restart ControlCenter
  ansible.builtin.command: /usr/bin/killall ControlCenter
  changed_when: true
  failed_when: false

- name: Restart NotificationCenter
  ansible.builtin.command: /usr/bin/killall NotificationCenter
  changed_when: true
  failed_when: false

- name: Restart WindowManager
  ansible.builtin.command: /usr/bin/killall WindowManager
  changed_when: true
  failed_when: false
