---
# macOS software updates and Xcode CLT are handled by Whitesnake before Ansible runs.
# Homebrew path is guaranteed at /opt/homebrew/bin/brew on Apple Silicon by Whitesnake.

- name: Upgrade Homebrew formulas
  community.general.homebrew:
    path: /opt/homebrew/bin
    upgrade_all: true
  become: false
  tags:
    - update

- name: Upgrade Homebrew casks
  community.general.homebrew_cask:
    path: /opt/homebrew/bin
    upgrade_all: true
  become: false
  tags:
    - update
